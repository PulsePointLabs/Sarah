apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def sarahChatOnly = providers.gradleProperty('sarahChatOnly').orNull?.toBoolean() ?: false
def wakeModelName = 'vosk-model-small-en-us-0.15'
def wakeModelSha256 = '30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498'
def wakeAssets = layout.buildDirectory.dir('generated/sarahWakeAssets')
def prepareWakeModel = tasks.register('prepareWakeModel') {
    inputs.property('sha256', wakeModelSha256)
    outputs.dir(wakeAssets)
    doLast {
        def cache = new File(gradle.gradleUserHomeDir, "caches/sarah-models/${wakeModelName}.zip")
        def checksum = { File file ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            file.withInputStream { input ->
                byte[] buffer = new byte[65536]
                for (int count = input.read(buffer); count != -1; count = input.read(buffer)) {
                    digest.update(buffer, 0, count)
                }
            }
            digest.digest().encodeHex().toString()
        }
        if (!cache.isFile() || checksum(cache) != wakeModelSha256) {
            cache.parentFile.mkdirs()
            def temporary = File.createTempFile('sarah-wake-', '.zip', cache.parentFile)
            try {
                def connection = new URI("https://alphacephei.com/vosk/models/${wakeModelName}.zip").toURL().openConnection()
                connection.connectTimeout = 15000
                connection.readTimeout = 30000
                connection.inputStream.withCloseable { input ->
                    temporary.withOutputStream { output -> output << input }
                }
                if (checksum(temporary) != wakeModelSha256) throw new GradleException('Sarah speech model checksum failed.')
                java.nio.file.Files.move(temporary.toPath(), cache.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } finally {
                temporary.delete()
            }
        }
        def modelDir = wakeAssets.get().dir('model-en-us').asFile
        project.sync { copy ->
            copy.from(project.zipTree(cache)) { source ->
                source.eachFile { entry -> entry.path = entry.path.substring(wakeModelName.length() + 1) }
                source.includeEmptyDirs = false
            }
            copy.into(modelDir)
        }
        new File(modelDir, 'uuid').text = wakeModelSha256
    }
}

android {
    namespace = "com.pulsepointlabs.sarah"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId sarahChatOnly ? "com.pulsepointlabs.sarahchat" : "com.pulsepointlabs.sarah"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 304
        versionName "0.1.304"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "boolean", "SARAH_CHAT_ONLY", sarahChatOnly.toString()
        manifestPlaceholders = [appLabel: sarahChatOnly ? "Sarah Chat" : "Sarah"]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    sourceSets.main.assets.srcDir(wakeAssets)
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}
tasks.named('preBuild').configure { dependsOn(prepareWakeModel) }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.health.connect:connect-client:1.1.0"
    implementation "androidx.media3:media3-exoplayer:1.9.0"
    implementation "androidx.media3:media3-session:1.9.0"
    implementation "androidx.media3:media3-ui:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation 'com.alphacephei:vosk-android:0.3.75'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
